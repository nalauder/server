services:
  hashtopolis-server-dev:
    container_name: hashtopolis-server-dev
    build:
      context: ..
      target: hashtopolis-server-dev
      args:
        - CONTAINER_USER_CMD_PRE
        - CONTAINER_USER_CMD_POST
    environment:
      HASHTOPOLIS_DB_TYPE: mysql
      HASHTOPOLIS_DB_USER: hashtopolis
      HASHTOPOLIS_DB_PASS: hashtopolis
      HASHTOPOLIS_DB_HOST: hashtopolis-db-dev
      HASHTOPOLIS_DB_DATABASE: hashtopolis
      HASHTOPOLIS_APIV2_ENABLE: 1
      # The refresh token cookie is only sent cross-origin when the API names a concrete allowed
      # origin instead of a wildcard, so the dev frontend on :4200 has to be named here.
      HASHTOPOLIS_BACKEND_URL: http://localhost:8080/api/v2
      HASHTOPOLIS_FRONTEND_URLS: http://localhost:4200,http://127.0.0.1:4200
      HASHTOPOLIS_CRON_ENABLE: 0
      # OIDC single sign-on against the dev Keycloak below.
      # ALLOW_INSECURE_HTTP permits http:// provider URLs and is for development/testing ONLY.
      HASHTOPOLIS_OIDC_ISSUER: http://keycloak:8180/realms/hashtopolis
      HASHTOPOLIS_OIDC_CLIENT_ID: hashtopolis
      HASHTOPOLIS_OIDC_CLIENT_SECRET: dev-only-secret
      HASHTOPOLIS_OIDC_DISPLAY_NAME: Keycloak
      HASHTOPOLIS_OIDC_ALLOW_INSECURE_HTTP: "true"
    depends_on:
      - hashtopolis-db-dev
    ports:
      - "8080:80"
    volumes:
      # This is where VS Code should expect to find your project's source code
      # and the value of "workspaceFolder" in .devcontainer/devcontainer.json
      - ..:/var/www/html
      - hashtopolis-server-dev:/usr/local/share/hashtopolis:Z
      # - ./jwks.json:/keys/jwks.json:ro
    networks:
      - hashtopolis_dev
  hashtopolis-db-dev:
    container_name: hashtopolis-db-dev
    image: mysql:9.7
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - hashtopolis-db-dev:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: hashtopolis
      MYSQL_DATABASE: hashtopolis
      MYSQL_USER: hashtopolis
      MYSQL_PASSWORD: hashtopolis
    networks:
      - hashtopolis_dev
  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev --import-realm --http-port=8180
    environment:
      KC_HOSTNAME: http://keycloak:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    networks:
      - hashtopolis_dev
volumes:
  hashtopolis-db-dev:
  hashtopolis-server-dev:

networks:
  hashtopolis_dev:
    # This network will also be used by the python-agent
    name: hashtopolis_dev
